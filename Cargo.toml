[package]
name = "ecapplog"
version = "1.0.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Client for the ECAppLog debug log viewer, with log and tracing adapters"
repository = "https://github.com/RangelReale/ecapplog-rust"
homepage = "https://github.com/RangelReale/ecapplog"
documentation = "https://docs.rs/ecapplog"
readme = "README.md"
keywords = ["logging", "log", "tracing", "debugging", "ecapplog"]
categories = ["development-tools::debugging"]
authors = ["Rangel Reale <rangelreale@gmail.com>"]

[features]
default = []
# Both adapters are opt-in: an application that only wants the direct API should not pull in a
# logging facade it never calls.
log = ["dep:log"]
tracing = ["dep:tracing-core", "dep:tracing-log", "dep:tracing-subscriber"]

[dependencies]
# The payload is a nine-field JSON object; hand-rolling the string escaping would be the one place
# in this crate where a bug corrupts every message rather than one.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

# `std` (which implies `alloc`) is what provides `set_boxed_logger`; the facade is
# no_std-first and gates it off by default.
log = { version = "0.4.30", features = ["std"], optional = true }
# tracing-core rather than tracing: the layer only consumes events, so it does not need the
# macros, and depending on the facade from a subscriber crate invites version skew.
tracing-core = { version = "0.1.36", optional = true }
# The `log` facade reaches a subscriber through `tracing-log`'s bridge, whose event metadata names
# the target `log` and carries the record's own target, module path, file and line in fields
# instead. `NormalizeEvent` reads those back, and recognises a bridged event by callsite identity --
# so this must be the same `tracing-log` the application's subscriber installed, which cargo's
# version unification gives as long as nothing in the tree is on another major version.
tracing-log = { version = "0.2.0", optional = true }
# `registry` is what makes `LookupSpan` (and therefore span field capture) available; the default
# feature set additionally drags in `fmt`, `ansi` and a regex-based EnvFilter that this layer
# never touches.
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "registry",
    "std",
], optional = true }

[dev-dependencies]
# The examples and the bridge test need the facades' macros, which the library itself deliberately
# does not depend on.
log = "0.4.30"
tracing = "0.1.44"

[[example]]
name = "log_facade"
required-features = ["log"]

[[example]]
name = "tracing_layer"
required-features = ["tracing"]

[[test]]
name = "tracing_log_bridge"
required-features = ["tracing"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
